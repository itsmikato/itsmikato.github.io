  <style>

    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    html { touch-action: pan-y; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; perspective: 1100px; }
    .head, .ring { grid-area: 1 / 1; width: min(92vw, 92vh); aspect-ratio: 1; }
    .head { position: relative; transform-style: preserve-3d; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .ring text { font: 600 50px Unb, sans-serif; fill: #6ccfcf; letter-spacing: 3px; }
    /* blinks squash each eye around its own centre (as % of the view box) */
    .eye-left { transform-origin: 38.1% 45.6%; }
    .eye-right { transform-origin: 61.6% 45.0%; }

<script>
/* The head turns toward the pointer: the whole head rotates, and each layer of the
   drawing sits at its own depth, so the snout swings further than the ears – a turn
   built from a single front view. The pupils get there first. Idle, it sways a little
   and blinks now and then. */
const head = document.querySelector('.head');
const layers = [...document.querySelectorAll('.layer')];
const ring = document.querySelector('.ring-turn');
const eyes = [...document.querySelectorAll('.eye-left, .eye-right')];
const pupils = [...document.querySelectorAll('.pupil')];
const MAX_YAW = 26, MAX_PITCH = 14;             // degrees
const PUPIL_RANGE = { x: 6.5, y: 3.0 };   // drawing units
const PERSPECTIVE = 1100;
const params = new URLSearchParams(location.search);
const EMBEDDED = params.has('embed');
// a still for the cover (?still): one fixed pose, no blinking
const STILL = params.has('still');
const STILL_POSE = { x: 0.32, y: -0.12 }, STILL_RING = -14;
// with "reduce motion" on: it still looks where you point, but doesn't sway, blink or turn the ring
const calm = matchMedia('(prefers-reduced-motion: reduce)');

let target = { x: 0, y: 0 }, now = { x: 0, y: 0 }, gaze = { x: 0, y: 0 };
let lastMove = -1e9, hold = 2500;               // how long it keeps looking after the last move

function aim(clientX, clientY, w = innerWidth, h = innerHeight, touch = false) {
    target.x = Math.max(-1, Math.min(1, (clientX - w / 2) / (w / 2)));
    target.y = Math.max(-1, Math.min(1, (clientY - h / 2) / (h / 2)));
    lastMove = performance.now();
    // a tap is a single glance: keep looking there a while longer than after a mouse move
    hold = touch ? 5000 : 2500;
}
const touchy = (e) => e.pointerType === 'touch' || e.pointerType === 'pen';
addEventListener('pointermove', (e) => aim(e.clientX, e.clientY, innerWidth, innerHeight, touchy(e)));
addEventListener('pointerdown', (e) => aim(e.clientX, e.clientY, innerWidth, innerHeight, touchy(e)));
// embedded: the project page passes on the pointer (moves and taps) from anywhere on the page
addEventListener('message', (e) => {
    if (e.origin === location.origin && e.data?.livePointer) {
        const p = e.data.livePointer;
        aim(p.x, p.y, p.w, p.h, p.touch);
    }
});

// blink: the eyes squash shut and open again
function blink() {
    if (running && !calm.matches) {
        for (const eye of eyes) {
            eye.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.08)' }, { transform: 'scaleY(1)' }],
                { duration: 180, easing: 'ease-in-out', composite: 'add' });
        }
    }
    setTimeout(blink, 2500 + Math.random() * 4000);
}
if (!STILL) setTimeout(blink, 1800);

function frame(t) {
    if (!running) { ticking = false; return; }
    const idle = t - lastMove > hold;
    const sway = calm.matches ? { x: 0, y: 0 } : { x: Math.sin(t / 2600) * 0.35, y: Math.sin(t / 3700) * 0.15 };
    const goal = STILL ? STILL_POSE : idle ? sway : target;
    const ease = STILL ? 1 : idle ? 0.03 : 0.09;
    now.x += (goal.x - now.x) * ease;
    now.y += (goal.y - now.y) * ease;
    // the eyes lead: they reach the goal well before the head does
    const lead = STILL ? 1 : idle ? 0.08 : 0.3;
    gaze.x += (goal.x - gaze.x) * lead;
    gaze.y += (goal.y - gaze.y) * lead;
    for (const pupil of pupils) {
        pupil.setAttribute('transform', `translate(${gaze.x * PUPIL_RANGE.x} ${gaze.y * PUPIL_RANGE.y})`);
    }

    const size = head.clientWidth, unit = size / 620;
    head.style.transform = `rotateX(${-now.y * MAX_PITCH}deg) rotateY(${now.x * MAX_YAW}deg)`;
    for (const layer of layers) {
        const z = +layer.dataset.z * unit * 0.8;
        // pushed forward, a layer also grows: scale it back so the drawing keeps its size at rest
        layer.style.transform = `translateZ(${z}px) scale(${(PERSPECTIVE - z) / PERSPECTIVE})`;
    }
    const turn = STILL ? STILL_RING : calm.matches ? 0 : t / 400 % 360;
    ring.setAttribute('transform', `rotate(${turn} 612 300)`);
    requestAnimationFrame(frame);
}

// only animate while it can be seen: the tab is visible and the frame is on screen
let running = false, ticking = false, onScreen = true;
function update() {
    running = !document.hidden && onScreen;
    if (running && !ticking) { ticking = true; requestAnimationFrame(frame); }
}
document.addEventListener('visibilitychange', update);
new IntersectionObserver(([entry]) => { onScreen = entry.isIntersecting; update(); })
    .observe(document.querySelector('.stage'));
update();

// embedded: the page around it handles the arrow keys and Esc
if (EMBEDDED && window.parent !== window) {
    addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'Escape'].includes(e.key)) {
            e.preventDefault();
            window.parent.postMessage({ specimenKey: e.key }, location.origin);
        }
    });
}
</script>
